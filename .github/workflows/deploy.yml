name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Actions 탭에서 수동 실행도 가능하게 한다
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 나중 것만 살린다. 진행 중인 배포는 끊지 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 프로젝트 사이트라 하위 경로로 서비스된다.
      # vite.config.ts 의 base 와 App.tsx 의 BrowserRouter basename 이
      # 모두 이 값을 읽으므로 여기만 맞추면 된다.
      - name: Build
        env:
          BASE_PATH: /boatpage/
        run: npm run build

      # GitHub Pages 는 정적 호스팅이라 /models 같은 클라이언트 라우트로
      # 직접 접속하면 404 를 준다. 404.html 을 index.html 과 같게 두면
      # Pages 가 이 파일을 돌려주고, 그 뒤 라우터가 경로를 처리한다.
      - name: SPA fallback
        run: cp out/index.html out/404.html

      # Jekyll 이 밑줄로 시작하는 파일/폴더를 걸러내는 것을 막는다
      - name: Disable Jekyll
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
